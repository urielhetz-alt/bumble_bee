<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bumble Bee — New Tab</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#5d3a1a;background:linear-gradient(135deg,#e8d4b8,#d9c4a8);display:grid;place-items:center}main{width:min(900px,92vw);text-align:center}.bee{font-size:58px}h1{font-size:48px;color:#8b5a2b}.subtitle{color:#7a5735;margin-bottom:30px}.card{background:#fef7f0d9;border-radius:20px;padding:14px;box-shadow:0 12px 35px #8b5a2b22}.search{display:flex;gap:10px}input{flex:1;padding:16px;border:2px solid #dfc09a;border-radius:13px;font-size:16px}button{border:0;border-radius:13px;padding:14px 22px;background:#d4a574;color:white;font-weight:bold;cursor:pointer}.hint,footer{font-size:12px;color:#a0704f;margin:10px}.studio{display:inline-block;margin:22px;padding:14px 22px;border:2px solid #d4a574;border-radius:13px;background:#f5ead6;color:#8b5a2b;text-decoration:none;font-weight:bold}.joke{text-align:left;padding:24px}.label{font-size:12px;color:#a0704f;text-transform:uppercase;font-weight:bold;margin-bottom:10px}#newJoke{margin-top:14px;background:#8b5a2b;font-size:12px;padding:10px 14px}@media(max-width:600px){.search{flex-direction:column}h1{font-size:36px}.joke{text-align:center}}</style></head><body><main><div class="bee">🐝</div><h1>Good to see you.</h1><p class="subtitle">A calm little corner of the web.</p><div class="card"><form class="search" id="searchForm"><input id="query" type="search" autofocus placeholder="Search with Ecosia…"><button>Search</button></form><div class="hint">Default search engine: Ecosia 🌱</div></div><a class="studio" href="STUDIO.HTML">🛠️ Open Bumble Bee Studio</a><div class="card joke"><div class="label">☀️ A little encouragement</div><div id="joke"></div><button id="newJoke">Another one ✨</button></div><footer>🐝 Bumble Bee · Take your time. You're doing fine.</footer></main><script>const jokes=["Why did the bee get a good grade? Because it always stayed focused and never gave up! 🐝","Small progress is still progress. Even a bee builds a hive one tiny piece at a time.","Why don't programmers like nature? Too many bugs. Good thing you're learning how to fix them! 😄","You don't have to be perfect today. Curious is more than enough.","Bee-lieve in yourself. You've already solved problems you once thought were impossible."];const j=document.getElementById("joke");function setJoke(){j.textContent=jokes[Math.floor(Math.random()*jokes.length)]}setJoke();document.getElementById("newJoke").onclick=setJoke;document.getElementById("searchForm").onsubmit=e=>{e.preventDefault();const q=document.getElementById("query").value.trim();const engine=localStorage.getItem("bumblebee-search-url")||"https://www.ecosia.org/search?q=%s";if(q)location.href=engine.includes("%s")?engine.replace("%s",encodeURIComponent(q)):engine+encodeURIComponent(q)}</script></body></html>
